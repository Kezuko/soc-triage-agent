name: ci

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      run_eval:
        description: "Run the live eval against the OpenAI API (needs OPENAI_API_KEY secret)"
        type: boolean
        default: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -q

  eval:
    if: github.event_name == 'workflow_dispatch' && inputs.run_eval
    needs: test
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m evals.run_eval
      - uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: evals/results/
